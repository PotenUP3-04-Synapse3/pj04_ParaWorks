[project]
name = "pj04-paraworks"
version = "0.1.0"
description = "ParaWorks - Enterprise Knowledge & History Management Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # ── Web Framework ──────────────────────────────────────────────────────────
    "fastapi>=0.133.0",
    "uvicorn[standard]>=0.41.0",
    "python-multipart>=0.0.22",
    "httpx>=0.28.0",

    # ── LangChain / LangGraph (1.2+) ──────────────────────────────────────────
    "langchain>=1.2",
    "langchain-openai>=0.4",
    "langchain-community>=0.4",
    "langgraph>=0.5",
    "langgraph-checkpoint-postgres>=0.5",

    # ── Data Validation ────────────────────────────────────────────────────────
    "pydantic>=2.12.5",
    "pydantic-settings>=2.9.0",

    # ── Database & Vector Store ────────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.16.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",

    # ── Google APIs (Drive, Gmail, Calendar) ───────────────────────────────────
    "google-api-python-client>=2.169.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth>=2.40.0",

    # ── Slack ──────────────────────────────────────────────────────────────────
    "slack-sdk>=3.35.0",

    # ── Document Parsers ───────────────────────────────────────────────────────
    "pypdf>=5.4.0",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "pyhwp>=0.1b12",          # HWP/HWPX 파싱 (primary)
    "markdown>=3.8",
    "lxml>=6.0.2",
    "beautifulsoup4>=4.14.3",

    # ── Embeddings & NLP ───────────────────────────────────────────────────────
    "sentence-transformers>=5.2.3",
    "tiktoken>=0.9.0",

    # ── Azure ──────────────────────────────────────────────────────────────────
    "azure-identity>=1.23.0",
    "azure-ai-contentsafety>=1.0.0",

    # ── Auth & Security ────────────────────────────────────────────────────────
    "python-jose[cryptography]>=3.4.0",
    "bcrypt>=4.0.0",

    # ── Reliability & Observability ────────────────────────────────────────────
    "tenacity>=9.1.0",
    "structlog>=25.3.0",

    # ── ML / Data ─────────────────────────────────────────────────────────────
    "accelerate>=1.13.0",
    "bitsandbytes>=0.49.2",
    "catboost>=1.2.10",
    "fastparquet>=2025.12.0",
    "folium>=0.20.0",
    "grad-cam>=1.5.5",
    "jupyter>=1.1.1",
    "koreanize-matplotlib>=0.1.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "optuna>=4.7.0",
    "pandas<3.0.0",
    "playwright>=1.58.0",
    "pyarrow>=23.0.1",
    "pytz>=2026.1.post1",
    "requests>=2.32.5",
    "safetensors>=0.7.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "setuptools==80.10.2",
    "shap>=0.51.0",
    "tensorboard>=2.20.0",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "torchsummary>=1.5.1",
    "torchvision>=0.25.0",
    "tqdm>=4.67.3",
    "transformers>=5.3.0",
    "uuid>=1.30",
    "xgboost>=3.2.0",
]

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu126" # 본인의 CUDA 버전에 맞춤
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-gpu", marker = "sys_platform == 'win32'" },
  { index = "pytorch-gpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-gpu", marker = "sys_platform == 'win32'" },
  { index = "pytorch-gpu", marker = "sys_platform == 'linux'" },
]
torchaudio = [
  { index = "pytorch-gpu", marker = "sys_platform == 'win32'" },
  { index = "pytorch-gpu", marker = "sys_platform == 'linux'" },
]

[tool.ruff]
line-length = 88
target-version = "py311"
fix = true

[tool.ruff.lint]
select = [ 
    "E",   
    "F",   
    "I",   
    "B",   
    "C4",  
    "UP",  
    "N",   
    "SIM", 
]
ignore = [
    "E501",
    "N803",
    'N812',
    'E401',
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"*.py" = ["ANN", "INP001"]

[tool.mypy]
ignore_missing_imports = true
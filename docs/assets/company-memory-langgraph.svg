<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">ParaWorks Company Memory LangGraph</title>
  <desc id="desc">LangGraph workflow from start to evidence collection, review candidates, memory retrieval, RAG answer, and end.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#21132b" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L12 7 L2 12 Z" fill="#5b4867"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#f7f3ee"/>
  <rect x="64" y="62" width="1152" height="596" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <text x="104" y="126" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#21132b">ParaWorks Company Memory LangGraph</text>
  <text x="104" y="164" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6c5d73">Backend: langgraph | Dry-run cost: $0 | Guardrails: delta sync, source hash skip, evidence token budget</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="114" y="320" width="116" height="76" rx="38" fill="#f4f8f6" stroke="#20b486" stroke-width="2"/>
    <text x="172" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#22513f">START</text>
    <text x="172" y="374" text-anchor="middle" font-size="12" fill="#22513f">StateGraph</text>

    <rect x="292" y="282" width="178" height="152" rx="18" fill="#fbfaf8" stroke="#ded6cc" stroke-width="2"/>
    <text x="381" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#6c5d73">STEP 1</text>
    <text x="381" y="354" text-anchor="middle" font-size="20" font-weight="800" fill="#21132b">collect_evidence</text>
    <text x="381" y="386" text-anchor="middle" font-size="13" fill="#6c5d73">Slack, Gmail, Drive,</text>
    <text x="381" y="408" text-anchor="middle" font-size="13" fill="#6c5d73">approved knowledge</text>

    <rect x="532" y="282" width="178" height="152" rx="18" fill="#fbfaf8" stroke="#ded6cc" stroke-width="2"/>
    <text x="621" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#6c5d73">STEP 2</text>
    <text x="621" y="354" text-anchor="middle" font-size="20" font-weight="800" fill="#21132b">draft_review</text>
    <text x="621" y="381" text-anchor="middle" font-size="20" font-weight="800" fill="#21132b">candidates</text>
    <text x="621" y="412" text-anchor="middle" font-size="13" fill="#6c5d73">Human approval gate</text>

    <rect x="772" y="282" width="178" height="152" rx="18" fill="#fbfaf8" stroke="#ded6cc" stroke-width="2"/>
    <text x="861" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#6c5d73">STEP 3</text>
    <text x="861" y="354" text-anchor="middle" font-size="20" font-weight="800" fill="#21132b">retrieve_company</text>
    <text x="861" y="381" text-anchor="middle" font-size="20" font-weight="800" fill="#21132b">memory</text>
    <text x="861" y="412" text-anchor="middle" font-size="13" fill="#6c5d73">pgvector-ready retrieval</text>

    <rect x="1012" y="282" width="178" height="152" rx="18" fill="#fbfaf8" stroke="#ded6cc" stroke-width="2"/>
    <text x="1101" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#6c5d73">STEP 4</text>
    <text x="1101" y="354" text-anchor="middle" font-size="20" font-weight="800" fill="#21132b">answer_with_rag</text>
    <text x="1101" y="386" text-anchor="middle" font-size="13" fill="#6c5d73">RAG Orchestrator Agent</text>

    <path d="M230 358 H274" stroke="#5b4867" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
    <path d="M470 358 H514" stroke="#5b4867" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
    <path d="M710 358 H754" stroke="#5b4867" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
    <path d="M950 358 H994" stroke="#5b4867" stroke-width="3" marker-end="url(#arrow)" fill="none"/>

    <rect x="468" y="505" width="344" height="70" rx="18" fill="#f4f8f6" stroke="#20b486" stroke-width="2"/>
    <text x="640" y="535" text-anchor="middle" font-size="16" font-weight="800" fill="#22513f">Cost policy</text>
    <text x="640" y="560" text-anchor="middle" font-size="14" fill="#22513f">delta_sync_hash_skip_evidence_budget</text>
  </g>
</svg>
